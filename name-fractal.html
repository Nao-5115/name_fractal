<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>名前フラクタル</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="cv"></canvas>

  <div class="info">
    <b id="ttl"></b>
    <div id="prm"></div>
  </div>

  <div class="dock">
    <div class="themes" id="shapes"><span class="lab">形</span></div>
    <div class="themes" id="themes"><span class="lab">色</span></div>
    <div class="bar">
      <input id="name" maxlength="16" placeholder="名前（漢字OK）" autocomplete="off">
      <input id="kana" maxlength="32" placeholder="ふりがな（なくてもOK）" autocomplete="off">
      <button id="go">つくる</button>
      <button id="save" class="sub">画像を保存</button>
    </div>
  </div>

  <script src="js/webgl-renderer.js"></script>
  <script src="js/name-parameters.js"></script>
  <script src="js/presets-ui.js"></script>
  <script src="js/animation.js"></script>
  <script src="js/controls.js"></script>
</body>
</html>
