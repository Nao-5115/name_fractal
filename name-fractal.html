<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Name Fractal</title>
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="cv"></canvas>

    <div class="info">
      <b id="ttl"></b>
      <div id="prm"></div>
    </div>

    <!-- 下のバー。形・色の候補（#shapes / #themes）は presets-ui.js が中に入れる -->
    <div class="dock">
      <div class="menu">
        <button
          id="shapeBtn"
          class="menu-btn"
          type="button"
          aria-expanded="false"
          aria-controls="shapes"
        >
          別の形を試す
        </button>
        <div class="options" id="shapes" hidden></div>
      </div>
      <div class="menu">
        <button
          id="themeBtn"
          class="menu-btn"
          type="button"
          aria-expanded="false"
          aria-controls="themes"
        >
          別の色を試す
        </button>
        <div class="options" id="themes" hidden></div>
      </div>
      <input
        id="name"
        maxlength="16"
        placeholder="名前"
        aria-label="名前"
        autocomplete="off"
      />
      <input
        id="kana"
        maxlength="32"
        placeholder="ふりがな（なくてもOK）"
        aria-label="ふりがな"
        autocomplete="off"
      />
      <button id="go" type="button">作る</button>
      <button id="share" class="sub" type="button">画像を保存</button>
    </div>

    <!-- QRコードから開いたスマホ向けの操作バー -->
    <div class="vbar">
      <button class="vbar-action" id="vsave" type="button">
        <img src="icons/add_photo.png" alt="" />
        <span>画像を保存</span>
      </button>
      <button
        class="vbar-action"
        id="vnew"
        type="button"
        aria-expanded="false"
        aria-controls="createPanel"
      >
        <img src="icons/add_box.png" alt="" />
        <span>新しくつくる</span>
      </button>
      <a class="vbar-action" href="explanation.html">
        <img src="icons/info.svg" alt="" />
        <span>フラクタルとは</span>
      </a>
    </div>

    <!-- スマホ用の新規作成パネル。デスクトップ用の入力欄と候補をここへ移して使う -->
    <div class="create-panel" id="createPanel" hidden></div>

    <!-- QRコードや保存用の画像を出すウィンドウ -->
    <div class="modal" id="modal" hidden>
      <div class="card" id="modalBody"></div>
    </div>

    <script src="js/webgl-renderer.js"></script>
    <script src="js/name-parameters.js"></script>
    <script src="js/presets-ui.js"></script>
    <script src="js/animation.js"></script>
    <script src="js/export-artwork.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/qrcode.js"></script>
    <script src="js/share.js"></script>
    <script src="js/menu.js"></script>
  </body>
</html>
