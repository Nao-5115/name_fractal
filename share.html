<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1733">
  <title>フラクタルを保存 | 名前フラクタル</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="share-page" data-page="share">
  <canvas id="cv" aria-label="共有されたフラクタル作品"></canvas>

  <div class="info">
    <b id="ttl">作品を準備しています…</b>
    <div id="prm"></div>
  </div>

  <a class="learn-link" href="index.html">名前フラクタル <span aria-hidden="true">↗</span></a>

  <div class="dock">
    <p class="mobile-save-hint" id="share-hint">画像を端末に保存できます。iPhoneでは共有メニューから「画像を保存」を選べます。</p>
    <div class="themes" id="shapes"><span class="lab">形</span></div>
    <div class="themes" id="themes"><span class="lab">色</span></div>
    <div class="bar">
      <input id="name" maxlength="16" autocomplete="off" aria-hidden="true" tabindex="-1">
      <input id="kana" maxlength="32" autocomplete="off" aria-hidden="true" tabindex="-1">
      <button id="go" type="button" tabindex="-1">つくる</button>
      <button id="save" type="button">画像を保存</button>
    </div>
  </div>

  <script src="js/webgl-renderer.js"></script>
  <script src="js/name-parameters.js"></script>
  <script src="js/presets-ui.js"></script>
  <script src="js/animation.js"></script>
  <script src="js/controls.js"></script>
</body>
</html>
